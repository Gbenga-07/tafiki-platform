<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20460F">
<title>Tafiki · Offline</title>
<style>
  html,body{margin:0;height:100%;background:#20460F;color:#F7F5EC;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;box-sizing:border-box;gap:14px}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  h1{font-size:22px;margin:8px 0 0}
  p{margin:0;max-width:30ch;line-height:1.5;color:#D6E6C4;font-size:15px}
  button{margin-top:10px;border:0;border-radius:999px;padding:12px 26px;font:600 15px system-ui,sans-serif;background:#F7F5EC;color:#20460F;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/img/app/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Reconnect to continue. Tafiki never shows figures saved on this device, so nothing here is out of date.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
